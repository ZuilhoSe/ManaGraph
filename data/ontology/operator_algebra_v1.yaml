    param: [ChooseCreatureType]
    stochastic: [RollDice]

# Átomos-invólucro: cabem na álgebra só depois que os parâmetros forem lidos na
# Fase 2. A cota pessimista da cobertura os conta como fora. (Effect$ e os
# Continuous.Add* não entram: o conteúdo que concedem está em SVars, que o
# inventário já atomiza; ChangeZone já vem separado por zonas.)
generic:
  - api:ReplaceEffect
  - api:Animate
  - api:AnimateAll
  - api:AlterAttribute
  - api:Play
  - static:Continuous.MayPlay
  - replacement:Moved

# Classes cuja semântica está definida aqui mas cujo VALOR depende de algo que só
# existe em fases posteriores. O relatório de cobertura lista quantas cartas
# dependem de cada uma.
deferred_valuation:
  reference: "Fase 5 — resolver contra o grafo do deck: valor = melhor alvo da classe copiada"
  layer: "Fase 2 (ler o atributo alterado) + Fase 5 (aplicar na ordem do CR 613)"
  face_down: "Fase 2 — corpo 2/2 + custo de virar como alt_cost do operador real"
  turn: "Fase 5 — multiplicador do bloco de operadores no horizonte de V(D)"
  terminal: "Decisão em aberto 8.1 (recurso de vitória) + Fase 5"
  adversarial: "Fase 8 — modelo de oponente; até lá, minimax (pior opção para você)"
  stochastic: "Fase 2 — valor esperado sobre a distribuição do dado/moeda"
  param: "Fase 7 — o otimizador fixa a escolha junto com o deck"
